<!DOCTYPE html>
<html>
<head>
<style>

body{
    margin: 0;
    font-family: Arial, sans-serif;
}

.main-container{
    display: flex;
    min-height: 100vh;
    border: 3px solid black;
}

.sidebar{
    width: 20%;
    background-color: black;
    padding-top: 50px;
}

.menu{
    width: 120px;
    height: 30px;
    background-color: rgb(224,220,220);
    margin: 20px auto;
    border-radius: 5px;
    text-align: center;
    line-height: 30px;
    font-weight: bold;
}

.content{
    width: 80%;
    padding: 20px;
}

.boxes{
    display: flex;
    justify-content: space-evenly;
    flex-wrap: wrap;
}

.container{
    width: 220px;
    height: 320px;
    border: 2px solid red;
    text-align: center;
    padding-top: 15px;
    background-color: #f8f8f8;
}

.image-box{
    width: 180px;
    height: 240px;
    border: 2px solid #333;
    margin: auto;
    overflow: hidden;
}

.image-box img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.title{
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

.banner{
    margin-top: 50px;
    width: 100%;
}

.banner img{
    width: 100%;
    height: 250px;
    object-fit: cover;
    border: 2px solid black;
}

.banner-title{
    text-align: center;
    font-size: 50px;
    margin-top: 20px;
}

</style>
</head>

<body>

<div class="main-container">

    <div class="sidebar">
        <div class="menu">solo1</div>
        <div class="menu">solo2</div>
        <div class="menu">solo3</div>
        <div class="menu">solo4</div>
    </div>

    <div class="content">

        <div class="boxes">
    
            <div class="container">
                <div class="image-box">
                    <img src="solo1.jpg" alt="Solo Leveling Season 1">
                </div>
                <div class="title">Solo Leveling S1</div>
            </div>

   
            <div class="container">
                <div class="image-box">
                    <img src="solo2.jpg" alt="Solo Leveling Season 2">
                </div>
                <div class="title">Solo Leveling S2</div>
            </div>

        </div>

        <div class="banner">
            <img src="tyty.jpg" alt="Solo Leveling Banner">
        </div>

        <div class="banner-title">
            SOLO LEVELING
        </div>

    </div>

</div>

</body>
</html>
